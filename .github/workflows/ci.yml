name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --build-tags integration ./...
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: |
          go vet ./...
          go vet -tags=integration ./integration
      - name: Build
        run: go build ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout=5m ./...
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout=5m ./...

  vulnerability:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check vulnerabilities
        run: govulncheck ./...

  integration:
    name: Real Kea (${{ matrix.os }}, ${{ matrix.mode }}, ${{ matrix.security }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        mode: [direct, control-agent]
        security: [plain, basic, tls, mtls]
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      KEA_INTEGRATION_MODE: ${{ matrix.mode }}
      KEA_INTEGRATION_SECURITY: ${{ matrix.security }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Start Docker on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install colima docker docker-compose
          colima start --runtime docker --cpu 2 --memory 4
          docker info
      - name: Build and extract native executable with pinned buildx
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) target=linux/amd64 ;;
            macOS) target=darwin/amd64 ;;
            *) exit 1 ;;
          esac
          go tool buildx -v "snapshot-${GITHUB_SHA}" --name kea-mcp --main . --out dist --target "$target" --version-var github.com/rannday/kea-mcp/server.version
          mkdir -p dist/integration
          tar -xzf "dist/kea-mcp-snapshot-${GITHUB_SHA}-${target//\//-}.tar.gz" -C dist/integration
          ./dist/integration/kea-mcp --help
      - name: Test native executable against real Kea containers
        shell: bash
        env:
          KEA_MCP_BINARY: ${{ github.workspace }}/dist/integration/kea-mcp
          # Colima shares the runner's home, unlike macOS's default /var/folders temp.
          TMPDIR: ${{ runner.temp }}
        run: go test -tags=integration -count=1 -timeout=10m -v ./integration
      - name: Stop macOS Docker VM
        if: always() && runner.os == 'macOS'
        run: colima stop

  artifacts:
    name: Build deployment archives
    needs: [check, vulnerability, integration]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Select build version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            echo "BUILD_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "BUILD_VERSION=snapshot-${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi
      - name: Build archives with pinned buildx
        shell: bash
        run: go tool buildx -v "$BUILD_VERSION" --name kea-mcp --main . --out dist --version-var github.com/rannday/kea-mcp/server.version
      - name: Verify archives and smoke-test Linux executable
        shell: bash
        run: |
          cd dist
          sha256sum --check checksums.txt
          mkdir smoke
          tar -xzf "kea-mcp-${BUILD_VERSION}-linux-amd64.tar.gz" -C smoke
          ./smoke/kea-mcp --help
      - name: Upload deployment archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kea-mcp-${{ env.BUILD_VERSION }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tagged release
    needs: artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - name: Download verified archives with GitHub CLI
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --name "kea-mcp-$BUILD_VERSION" --dir dist
      - name: Verify release checksums
        shell: bash
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Publish release with GitHub CLI
        shell: bash
        run: |
          gh release create "$BUILD_VERSION" dist/*.zip dist/*.tar.gz dist/checksums.txt \
            --verify-tag --title "$BUILD_VERSION" --generate-notes --draft
          gh release edit "$BUILD_VERSION" --draft=false
