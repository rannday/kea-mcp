version: "2"

run:
  # Timeout for running linters
  timeout: 5m
  # Exit code when issues are found
  issues-exit-code: 1
  # Include test files in linting
  tests: true

linters:
  # Use golangci-lint's maintained default set for focused correctness checks.
  default: standard

  exclusions:
    # Preserve the vendor-directory exclusion.
    paths:
      - vendor
    # Relax errcheck only for test files.
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  # v2 runs formatting checks in the formatter section, not as linters.
  enable:
    - gofmt
    - goimports

issues:
  # Maximum issues count per same linter (0 = unlimited)
  max-issues-per-linter: 0
  # Maximum count of issues with the same text (0 = unlimited)
  max-same-issues: 0
