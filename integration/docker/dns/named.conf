options {
    directory "/var/cache/bind";
    pid-file "/var/run/named/named.pid";
    session-keyfile "/var/run/named/session.key";
    listen-on { any; };
    listen-on-v6 { any; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
};

# Public test credential; deliberately shared with the D2 fixture.
key "kea-ddns-key." {
    algorithm hmac-sha256;
    secret "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=";
};

zone "lab.example.test" {
    type primary;
    file "/var/cache/bind/primary/db.lab.example.test";
    allow-update { key "kea-ddns-key."; };
    notify no;
};

